name: todo-list

x-build-args: &build-args
  APP_VERSION: ${APP_VERSION:-dev}

services:
  db:
    image: todo-list/db:${APP_VERSION:-dev}
    build:
      context: ./database
      args: *build-args
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      POSTGRES_DB: ${POSTGRES_DB:-todo}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: todo-list/backend:${APP_VERSION:-dev}
    build:
      context: ./backend
      target: runtime
      args: *build-args
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-todo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-todo}
      DB_NAME: ${POSTGRES_DB:-todo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: todo-list/frontend:${APP_VERSION:-dev}
    build:
      context: ./frontend
      target: runtime
      args: *build-args
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
